name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional space-separated jasmine spec files; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        # Upstream ran ['lts/*', 'node']; pinned to the versions those aliases
        # resolved to at the 2.0.6 release (2021-05-27) so the legs stay era-correct.
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:specs
      - name: Run Selected Tests 👩🏽‍💻
        if: inputs.test-filter != ''
        run: npm test -- ${{ inputs.test-filter }}
      - name: Pack 📦
        if: matrix.node_version == '14'
        run: |
          npm i -g npm@7.12.0
          npm pack
      - name: Upload Artifact 📤
        if: matrix.node_version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '14'
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
